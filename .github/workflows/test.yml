name: test

# Gates main on the checks that previously only ran locally. `npm test` chains
# typecheck (all workspaces) -> validate:oils -> every workspace test suite.
# The build steps mirror railway.json's buildCommand, so a green run means the
# deploy will build too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only builds and tests. No untrusted input reaches a
# run: step, so there is nothing here that needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck --workspaces && validate:oils && test --workspaces
      - run: npm test

      # Mirrors railway.json: npm run build:oils && npm run build -w @soap-calc/web
      - run: npm run build:oils
      - run: npm run build:web

  # Separate job so a browser failure reads differently from a unit failure, and so the
  # two run in parallel — e2e needs neither the build (Playwright starts its own vite dev
  # server on 5199) nor build:oils (the canonical oil JSON is committed).
  #
  # Why this job exists: the e2e suite was local-only, and two tests sat broken on main
  # unnoticed — one since the CP split-liquid default changed, one until a later feature
  # audit ran the suite by hand.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache the browser binary (~130 MB) on the lockfile hash: any dependency change
      # re-downloads, which over-invalidates slightly but can never serve a browser that
      # mismatches the installed Playwright — the failure mode worth avoiding.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps pulls the OS libraries the browser needs; skip it on a cache hit, when
      # only the binary was restored.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        working-directory: packages/web
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e -w @soap-calc/web

      # trace: 'on-first-retry' means a flaky/failing test leaves a trace worth keeping —
      # the only way to debug a CI-only failure without guessing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
